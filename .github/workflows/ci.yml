name: CI

on:
  push:
  pull_request:

jobs:
  notebook-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt nbformat

      - name: Static checks on the notebook and the repository
        run: python .github/scripts/check_notebook.py
