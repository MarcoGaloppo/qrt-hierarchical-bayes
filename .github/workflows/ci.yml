name: CI

on:
  push:
  pull_request:

jobs:
  notebook-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu   # CPU wheel, no CUDA
          pip install -r requirements.txt nbformat pytest

      - name: Static checks on the notebooks and the repository
        run: python .github/scripts/check_notebook.py

      - name: Unit tests of cnn_utils.py on synthetic data
        run: python -m pytest tests -q
